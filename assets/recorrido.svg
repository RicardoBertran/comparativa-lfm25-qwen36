<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="220" viewBox="0 0 1040 220"><rect width="1040" height="220" rx="16" fill="#132237"/><g font-family="Arial,sans-serif" fill="white"><text x="28" y="38" font-size="21">Cómo repetir una prueba · esquema explicativo</text><g font-size="18"><text x="28" y="94">1. Instala y conecta</text><text x="292" y="94">2. Copia la entrada</text><text x="555" y="94">3. Ejecuta el prompt</text><text x="819" y="94">4. Comprueba</text></g><g font-size="14" fill="#b8d7f2"><text x="28" y="130">llama.cpp → Cline</text><text x="292" y="130">Una carpeta por modelo</text><text x="555" y="130">Una conversación nueva</text><text x="819" y="130">Tests, hashes y contenido</text><text x="28" y="186">Antes de repetir: revisa los materiales pendientes. Una tarea terminada debe dejar resultados verificables.</text></g></g></svg>
