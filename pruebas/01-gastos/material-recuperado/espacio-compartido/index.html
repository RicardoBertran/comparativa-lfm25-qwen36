<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos Personales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>💰 Control de Gastos</h1>
        <p>Gestiona tus finanzas personales</p>
    </header>

    <main>
        <!-- Panel de estadísticas -->
        <section class="dashboard">
            <div class="card saldo">
                <span class="card-label">Saldo Total</span>
                <span class="card-value" id="saldoTotal">€0,00</span>
            </div>
            <div class="card ingresos">
                <span class="card-label">Ingresos</span>
                <span class="card-value" id="totalIngresos">€0,00</span>
            </div>
            <div class="card gastos">
                <span class="card-label">Gastos</span>
                <span class="card-value" id="totalGastos">€0,00</span>
            </div>
        </section>

        <!-- Gráfico de gastos por categoría -->
        <section class="chart-section">
            <h2>Gastos por Categoría</h2>
            <div class="chart-container">
                <svg id="chartSVG" viewBox="0 0 300 300"></svg>
                <div id="chartLegend" class="chart-legend"></div>
            </div>
        </section>

        <!-- Lista de movimientos -->
        <section class="transactions-section">
            <h2>Movimientos</h2>
            <div id="transactionsList" class="transactions-list"></div>
        </section>

        <!-- Formulario para añadir movimiento -->
        <section class="form-section">
            <h2>Añadir Movimiento</h2>
            <form id="transactionForm" class="transaction-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="tipo">Tipo</label>
                        <select id="tipo" required>
                            <option value="gasto">Gasto</option>
                            <option value="ingreso">Ingreso</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cantidad">Cantidad (€)</label>
                        <input type="number" id="cantidad" min="0.01" step="0.01" placeholder="0,00" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="Alimentación">Alimentación</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Ocio">Ocio</option>
                            <option value="Salud">Salud</option>
                            <option value="Hogar">Hogar</option>
                            <option value="Educación">Educación</option>
                            <option value="Ropa">Ropa</option>
                            <option value="Salario">Salario</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Inversiones">Inversiones</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <input type="text" id="descripcion" placeholder="Descripción del movimiento" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <button type="submit" class="btn-submit">Añadir Movimiento</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
